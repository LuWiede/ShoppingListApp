<ion-menu contentId="main-content" side="start" type="overlay"
 [ngClass]="{ 'dark-mode-page': darkMode, 'kaufland-mode-page': kauflandMode }">
  <ion-header>
    <ion-toolbar class="toolbar">
      <ion-title>Menu</ion-title>
      <ion-buttons slot="start">
        <ion-menu-toggle auto-hide="true">
          <ion-button class="closeMenuButton">
            <ion-icon name="menu-outline"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>
      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/home">
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/recipes">
          <ion-icon slot="start" name="fast-food-outline"></ion-icon>
          <ion-label>Recipes</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/settings">
          <ion-icon slot="start" name="settings-outline"></ion-icon>
          <ion-label>Settings</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-header [translucent]="true"
  [ngClass]="{ 'dark-mode-page': darkMode, 'kaufland-mode-page': kauflandMode }">
  <ion-toolbar>
    <ion-title class="title">Home</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content"
  [ngClass]="{ 'dark-mode-page': darkMode, 'kaufland-mode-page': kauflandMode }">

  <!-- Statische ShoppingList oben -->
  <ion-card class="list-card" button="true" routerLink="/lists">
  <div class="card-content" [style.background]="cardBg('#537699')">
    <div class="text">
      <div class="title">Pauli's Einkaufsspaß</div>
      <div class="sub">{{ shoppingCount }} items</div>
    </div>
  </div>
</ion-card>

  <!-- Dynamische Listen darunter -->
  <ion-reorder-group [disabled]="false" (ionItemReorder)="reorderLists($event)">
  <ng-container *ngIf="lists$ | async as lists">
    <ion-item
      lines="none"
      class="list-card"
      *ngFor="let l of nonPinned(lists)"
      (click)="open(l.id)">

      <div class="card-content" [style.background]="cardBg(l.color)">
        <div class="text">
          <div class="title">{{ l.title }}</div>
          <div class="sub">{{ l.items.length }} items</div>
        </div>

        <!-- 3 Punkte NUR bei dynamischen Listen -->
        <ion-button
          [id]="'list-menu-' + l.id"
          fill="clear"
          size="small"
          class="menu-btn"
          (click)="$event.stopPropagation()">
          <ion-icon name="ellipsis-vertical"></ion-icon>
        </ion-button>
      </div>

      <!-- Reorder Handle -->
      <ion-reorder slot="end" class="list-reorder"></ion-reorder>

      <!-- Popover-Menü -->
      <ion-popover
        [trigger]="'list-menu-'+l.id"
        triggerAction="click"
        [dismissOnSelect]="true"
        [cssClass]="kauflandMode ? 'popover-light' : 'popover-dark'">
        <ng-template>
          <ion-list class="edit_delete_menu">
            <ion-item button lines="none" button (click)="onEditList(l, $event)">
              <ion-icon slot="start" name="create-outline"></ion-icon>
              <ion-label>Edit</ion-label>
            </ion-item>
            <ion-item button lines="none" button (click)="onDeleteList(l, $event)">
              <ion-icon slot="start" name="close-outline"></ion-icon>
              <ion-label>Delete</ion-label>
            </ion-item>
          </ion-list>
        </ng-template>
      </ion-popover>
    </ion-item>
  </ng-container>
</ion-reorder-group>

</ion-content>

<ion-footer class="add-footer"
  [ngClass]="{ 'dark-mode-page': darkMode, 'kaufland-mode-page': kauflandMode }">
  <ion-toolbar class="add-toolbar">
    <ion-button class="add-list-btn" (click)="addList()">Add List</ion-button>
  </ion-toolbar>
</ion-footer>
